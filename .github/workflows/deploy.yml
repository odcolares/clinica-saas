name: deploy-backend

# Deploy separado (CI não faz deploy). Apenas em branch protegida (master).
on:
  push:
    branches: [master]
    paths: ["backend/**", ".github/workflows/deploy.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install Render CLI
        run: |
          curl -sSL https://render-cli.com/install.sh | bash
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.render/bin:$PATH"
          which render

      - name: Deploy backend to Render
        run: render deploy --service "$RENDER_SERVICE_ID"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
